<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maintenance</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      font-family: system-ui, sans-serif;
      background: #f5f5f3;
    }
    .card {
      background: white;
      border: 1px solid #e5e5e3;
      border-radius: 12px;
      padding: 3rem 2.5rem;
      max-width: 480px;
      width: 100%;
      text-align: center;
    }
    .icon-wrap {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: #f0f0ee;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
    }
    .icon-wrap i { font-size: 24px; color: #888; }
    h1 { font-size: 20px; font-weight: 500; color: #1a1a1a; margin-bottom: 0.75rem; }
    .subtitle { font-size: 15px; color: #666; line-height: 1.6; margin-bottom: 2rem; }
    .divider { height: 1px; background: #e5e5e3; margin-bottom: 1.5rem; }
    .footer-text { font-size: 13px; color: #999; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap">
      <i class="ti ti-tool"></i>
    </div>
    <h1>Site en maintenance</h1>
    <p class="subtitle">Des améliorations sont en cours.<br>Le site sera de retour très prochainement.</p>
    <div class="divider"></div>
    <p class="footer-text">Merci pour votre patience.</p>
  </div>
</body>
</html>
